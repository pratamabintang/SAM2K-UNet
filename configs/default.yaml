# Configuration for Landslide Segmentation (SAM2 Hiera RGB + ConvNeXt DTM)

experiment:
  name: "sam2_convnext_rgb_dtm"
  seed: 1024
  runs_dir: "runs"

dataset:
  data_dir: "datasets/landslide"
  modalities:
    - "IMAGE"
    - "DTM"
  blacklist_path: "datasets/landslide/black_list.txt"
  size: 352
  batch_size: 12
  num_workers: 4

model:
  hiera_path: "checkpoints/sam2_hiera_large.pt"
  topo_backbone: "convnext_tiny"
  pretrained_topo: true
  use_kan: true

training:
  epochs: 20
  lr: 0.001
  weight_decay: 0.0005
  min_lr: 1.0e-7
  save_interval: 5
  eval_interval: 1
